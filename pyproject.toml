[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-finality-reference"
version = "0.1.0"
description = "Runnable reference implementation of protected execution finality with independently verifying Finality Sinks"
requires-python = ">=3.11"
license = {text = "SEE LICENSE-NOTICE.md"}
authors = [{name = "Reference implementation"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[project.optional-dependencies]
crypto = ["cryptography>=42"]
dev = ["pytest>=8", "pytest-cov>=6"]
